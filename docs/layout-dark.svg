<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Схема кадра: длинное видео 16:9 превращается в вертикальный ролик 9:16">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21262d"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="612" y="50" width="236" height="420" rx="18"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- исходное видео 16:9 -->
  <rect x="60" y="150" width="320" height="180" rx="14" fill="url(#src)" stroke="#484f58" stroke-width="2"/>
  <path d="M206 214 L206 266 L250 240 Z" fill="#c9d1d9"/>
  <text x="220" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#c9d1d9">16:9</text>

  <!-- стрелка -->
  <path d="M404 240 L566 240" stroke="#8b949e" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- телефон 9:16 -->
  <rect x="600" y="38" width="260" height="444" rx="38" fill="#30363d"/>
  <g clip-path="url(#screen)">
    <rect x="612" y="50" width="236" height="420" fill="url(#bottom)"/>
    <rect x="612" y="50" width="236" height="210" fill="url(#top)"/>
    <!-- момент: силуэт и искры -->
    <circle cx="730" cy="128" r="28" fill="#eef2ff"/>
    <path d="M676 214 Q676 166 730 166 Q784 166 784 214 Z" fill="#eef2ff"/>
    <circle cx="650" cy="92" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="812" cy="104" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="800" cy="168" r="2" fill="#ffffff" opacity="0.7"/>
    <!-- баннер на линии раздела (хромакей) -->
    <rect x="612" y="244" width="236" height="32" fill="#22c55e"/>
    <rect x="630" y="256" width="120" height="8" rx="4" fill="#ffffff"/>
    <rect x="762" y="256" width="66" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <!-- геймплей внизу -->
    <rect x="630" y="330" width="72" height="10" rx="3" fill="#484f58"/>
    <rect x="722" y="384" width="62" height="10" rx="3" fill="#484f58"/>
    <rect x="636" y="436" width="96" height="10" rx="3" fill="#484f58"/>
    <circle cx="688" cy="312" r="9" fill="#fb923c"/>
    <circle cx="672" cy="324" r="5" fill="#fb923c" opacity="0.45"/>
    <circle cx="660" cy="332" r="3" fill="#fb923c" opacity="0.2"/>
  </g>

  <!-- номера-выноски -->
  <g stroke="#6e7681" stroke-width="2">
    <path d="M860 140 L892 140"/>
    <path d="M860 260 L892 260"/>
    <path d="M860 370 L892 370"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="910" cy="140" r="16" fill="#818cf8"/><text x="910" y="146" fill="#0d1117">1</text>
    <circle cx="910" cy="260" r="16" fill="#22c55e"/><text x="910" y="266" fill="#0d1117">2</text>
    <circle cx="910" cy="370" r="16" fill="#e6edf3"/><text x="910" y="376" fill="#0d1117">3</text>
  </g>

  <text x="730" y="508" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">1080 × 1920</text>
</svg>
