[package]
name = "avtonarezka"
version = "0.4.2"
edition = "2021"
description = "Автонарезка: локальная нарезка видео в вертикальные рекламные ролики"

[workspace]
members = ["llm-worker"]

[features]
# Whisper на видеокарте через Vulkan (нужны vulkan-headers и glslc). Без неё — только процессор.
default = ["desktop", "gpu-probe"]
gpu-probe = ["whisper-rs/vulkan"]
# Окно, трей и всё, что нужно только оболочке Tauri. Без неё собирается безголовый демон для сервера:
# cargo build --no-default-features --features headless
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:webkit2gtk", "dep:cairo-rs", "dep:libloading"]
headless = []

[[bin]]
name = "avtonarezka"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "avtonarezka-daemon"
path = "src/bin/avtonarezka-daemon.rs"
required-features = ["headless"]

[[bin]]
name = "avtoctl"
path = "src/bin/avtoctl.rs"
required-features = ["headless"]

[lib]
name = "avtonarezka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "fs", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
http = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
rand = "0.9"
# местное время для окна публикации и суточного лимита
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = "0.16"
tract-onnx = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "multipart", "stream", "rustls"] }
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = "0.3"
chacha20poly1305 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }
libloading = { version = "0.7.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_LibraryLoader"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
serde_json = "1"
