[package]
name = "avtonarezka"
version = "0.2.6"
edition = "2021"
description = "Автонарезка: локальная нарезка видео в вертикальные рекламные ролики"

[workspace]
members = ["llm-worker"]

[features]
# Whisper на видеокарте через Vulkan (нужны vulkan-headers и glslc). Без неё — только процессор.
default = ["gpu-probe"]
gpu-probe = ["whisper-rs/vulkan"]

[lib]
name = "avtonarezka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "fs"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
http = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
rand = "0.9"
# местное время для окна публикации и суточного лимита
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = "0.16"
tract-onnx = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_LibraryLoader"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
serde_json = "1"
